    <head>

        <link rel="icon" href="mundom.png" type="image/png">
        <link rel="stylesheet" href="style.css">

    <body id="topo">
        <header>
            <h1>Fale Comigo</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Início</a></li>

                    <li><a href="sobre.html">Sobre</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <section>
                <h2>Deixe sua avaliação e comentário</h2>
                
                <form action="#" method="post">
                    <div class="form-group">
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" name="nome" required pattern="[A-Za-zÀ-ÿ\s]+" title="Apenas letras e espaços são permitidos" required placeholder="Digite seu nome">
                    </div>

                    <div class="form-group">
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" required placeholder="Digite seu e-mail">
                    </div>

                    <div class="form-group">
                        <label for="avaliacao">Sua Avaliação:</label>
                        <select id="avaliacao" name="avaliacao" required>
                            <option value="0">0</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="comentario">Deixe aqui seu comentário:</label>
                        <textarea id="comentario" name="comentario" rows="5" required placeholder="Escreva seu comentário..."></textarea>
                    </div>

                    <button type="submit">Enviar</button>
                </form>
            </section>
        </main>

        <footer>
            <h5>Breno Fernando 2026 - &copy Todos os direitos reservados.<br>Trabalho acadêmico sem fins lucrativos.</h5>
            <a href="#" class="btn-topo">Voltar ao topo</a>
        </footer>
    </body>
</html>
